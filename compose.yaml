name: worksphere

x-backend-service: &backend-service
  image: worksphere-backend:dev
  build:
    context: ./WorkSphere-backend
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  env_file:
    - ./WorkSphere-backend/.env
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:${BACKEND_PORT:-8000}
    FRONTEND_URL: http://localhost:${FRONTEND_PORT:-4200}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${MYSQL_DATABASE:-worksphere}
    DB_USERNAME: ${MYSQL_USER:-worksphere}
    DB_PASSWORD: ${MYSQL_PASSWORD:-worksphere}
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-4200},127.0.0.1:${FRONTEND_PORT:-4200}
    CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-4200}
  volumes:
    - ./WorkSphere-backend:/var/www/html
    - backend_vendor:/var/www/html/vendor

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-worksphere}
      MYSQL_USER: ${MYSQL_USER:-worksphere}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-worksphere}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${MYSQL_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *backend-service
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-service
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  queue:
    <<: *backend-service
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    <<: *backend-service
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: worksphere-frontend:dev
    build:
      context: ./WorkSphere-frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./WorkSphere-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4200').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  backend_vendor:
  frontend_node_modules:
  mysql_data:
