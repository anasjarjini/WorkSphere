<div class="flex flex-col gap-6 w-full max-w-7xl mx-auto">

  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="font-heading text-2xl font-bold text-primary">Mon équipe</h1>
      <p class="font-sans text-[0.9375rem] text-text-secondary mt-1">
        Consultez les membres de votre équipe
      </p>
    </div>
  </div>

  @if (successMessage()) {
    <div class="bg-success-light border border-success/20 rounded-md p-4 flex items-start gap-2.5 transition-all duration-200">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-success shrink-0 mt-0.5">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span class="text-sm font-medium text-success-dark flex-1">{{ successMessage() }}</span>
      <button (click)="dismissSuccess()" class="text-success-dark/60 hover:text-success-dark cursor-pointer transition-colors shrink-0 p-0.5 focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-primary/25">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  }

  @if (error()) {
    <div class="bg-error-light border border-error/20 rounded-md p-4 flex items-start gap-2.5 transition-all duration-200">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-error shrink-0 mt-0.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span class="text-sm font-medium text-error-dark flex-1">{{ error() }}</span>
      <button (click)="dismissError()" class="text-error/60 hover:text-error-dark cursor-pointer transition-colors shrink-0 p-0.5 focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-primary/25">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  }

  <div class="bg-surface border border-border rounded-xl shadow-sm p-5 transition-shadow duration-200 hover:shadow-md">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="sm:col-span-2 lg:col-span-1">
        <label class="font-sans text-[0.8125rem] font-semibold uppercase tracking-wider text-text-muted mb-1.5 block">
          Recherche
        </label>
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-text-muted pointer-events-none">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            [value]="searchTerm()"
            (input)="onSearchChange($any($event).target.value)"
            placeholder="Prénom, nom ou email…"
            class="w-full pl-10 pr-4 py-2.5 bg-surface border border-border rounded-md font-sans text-[0.9375rem] text-text transition-all duration-150 placeholder:text-text-muted placeholder:opacity-70 focus:border-border-focus focus:ring-2 focus:ring-primary/15 focus:outline-none"
          />
        </div>
      </div>

      <div>
        <label class="font-sans text-[0.8125rem] font-semibold uppercase tracking-wider text-text-muted mb-1.5 block">
          Rôle
        </label>
        <select
          [value]="roleFilter()"
          (change)="onRoleChange(($any($event).target).value)"
          class="w-full px-3.5 py-2.5 bg-surface border border-border rounded-md font-sans text-[0.9375rem] text-text transition-all duration-150 focus:border-border-focus focus:ring-2 focus:ring-primary/15 focus:outline-none cursor-pointer"
        >
          <option value="">Tous</option>
          <option value="HR_ADMIN">Admin RH</option>
          <option value="MANAGER">Manager</option>
          <option value="EMPLOYEE">Employé</option>
        </select>
      </div>

      <div>
        <label class="font-sans text-[0.8125rem] font-semibold uppercase tracking-wider text-text-muted mb-1.5 block">
          Département
        </label>
        <input
          type="text"
          [value]="departmentFilter()"
          (input)="onDepartmentChange($any($event).target.value)"
          placeholder="Nom du département"
          class="w-full px-3.5 py-2.5 bg-surface border border-border rounded-md font-sans text-[0.9375rem] text-text transition-all duration-150 placeholder:text-text-muted placeholder:opacity-70 focus:border-border-focus focus:ring-2 focus:ring-primary/15 focus:outline-none cursor-pointer"
        />
      </div>
    </div>
  </div>
</div>
