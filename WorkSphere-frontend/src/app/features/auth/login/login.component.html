<div class="min-h-screen flex items-center justify-center p-6 bg-background">
  <div class="bg-surface border border-border rounded-xl p-6 sm:p-8 shadow-sm w-full max-w-md transition-all duration-200 hover:shadow-md">
    <div class="text-center mb-8 flex flex-col items-center">
      <div class="w-12 h-12 bg-primary-50 text-primary rounded-md flex items-center justify-center mb-4 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <h1 class="font-heading text-2xl font-bold text-text-heading">WorkSphere</h1>
      <p class="font-sans text-sm text-text-secondary mt-1">Plateforme RH SaaS Intelligente</p>
    </div>

    @if (errorMessage()) {
      <div class="bg-error-light border border-error/20 rounded-md p-4 mb-6 flex items-start gap-2.5">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-error shrink-0 mt-0.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span class="text-sm font-medium text-error-dark">{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-1.5">
        <label for="email" class="font-sans text-[0.8125rem] font-semibold uppercase tracking-wider text-text">Adresse Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="nom@entreprise.com"
          class="w-full px-4 py-3 bg-surface border rounded-md font-sans text-[0.9375rem] text-text transition-all duration-150 placeholder:text-text-muted placeholder:opacity-70 focus:outline-none focus:ring-2 disabled:bg-background-alt disabled:text-text-muted disabled:cursor-not-allowed"
          [class.border-border]="!isFieldInvalid('email')"
          [class.focus:border-border-focus]="!isFieldInvalid('email')"
          [class.focus:ring-primary/15]="!isFieldInvalid('email')"
          [class.border-error]="isFieldInvalid('email')"
          [class.focus:border-error]="isFieldInvalid('email')"
          [class.focus:ring-error/15]="isFieldInvalid('email')"
          autocomplete="email"
        />
        @if (isFieldInvalid('email')) {
          <span class="text-xs font-medium text-error-dark mt-1 flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            Veuillez saisir une adresse email valide.
          </span>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between items-center">
          <label for="password" class="font-sans text-[0.8125rem] font-semibold uppercase tracking-wider text-text">Mot de passe</label>
          <a routerLink="/forgot-password" class="font-sans text-xs font-medium text-primary hover:text-primary-hover transition-colors duration-150 cursor-pointer">
            Mot de passe oublié ?
          </a>
        </div>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 bg-surface border rounded-md font-sans text-[0.9375rem] text-text transition-all duration-150 placeholder:text-text-muted placeholder:opacity-70 focus:outline-none focus:ring-2 disabled:bg-background-alt disabled:text-text-muted disabled:cursor-not-allowed"
          [class.border-border]="!isFieldInvalid('password')"
          [class.focus:border-border-focus]="!isFieldInvalid('password')"
          [class.focus:ring-primary/15]="!isFieldInvalid('password')"
          [class.border-error]="isFieldInvalid('password')"
          [class.focus:border-error]="isFieldInvalid('password')"
          [class.focus:ring-error/15]="isFieldInvalid('password')"
          autocomplete="current-password"
        />
        @if (isFieldInvalid('password')) {
          <span class="text-xs font-medium text-error-dark mt-1 flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            Le mot de passe est requis.
          </span>
        }
      </div>

      <button type="submit" class="w-full bg-primary text-text-inverse font-sans text-[0.9375rem] font-semibold px-6 py-3 rounded-md shadow-sm transition-all duration-200 hover:bg-primary-hover hover:shadow-md hover:-translate-y-px active:translate-y-0 active:shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 mt-2" [disabled]="isLoading() || loginForm.invalid">
        @if (isLoading()) {
          <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin inline-block"></span>
          Connexion en cours...
        } @else {
          Se connecter
        }
      </button>
    </form>
    
    <div class="flex justify-center mt-6">
      <a routerLink="/register-company" class="font-sans text-sm font-medium text-primary hover:text-primary-hover transition-colors duration-150 cursor-pointer">Créer un compte entreprise</a>
    </div>
  </div>
</div>
