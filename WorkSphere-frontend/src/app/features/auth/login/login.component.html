<div class="auth-container">
  <div class="card auth-card">
    <div class="auth-header">
      <div class="logo-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <h1 class="auth-title">WorkSphere</h1>
      <p class="auth-subtitle">Plateforme RH SaaS Intelligente</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="alert-icon">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">Adresse Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="nom@entreprise.com"
          class="form-control"
          [class.invalid]="isFieldInvalid('email')"
          autocomplete="email"
        />
        @if (isFieldInvalid('email')) {
          <span class="error-text">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px;">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            Veuillez saisir une adresse email valide.
          </span>
        }
      </div>

      <div class="form-group">
        <div class="flex justify-between items-center">
          <label for="password" class="form-label">Mot de passe</label>
        </div>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="form-control"
          [class.invalid]="isFieldInvalid('password')"
          autocomplete="current-password"
        />
        @if (isFieldInvalid('password')) {
          <span class="error-text">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px;">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            Le mot de passe est requis.
          </span>
        }
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="isLoading() || loginForm.invalid">
        @if (isLoading()) {
          <span class="spinner"></span>
          Connexion en cours...
        } @else {
          Se connecter
        }
      </button>
    </form>
    
    <div class="flex justify-center" style="margin-top: 1.5rem;">
      <a routerLink="/register-company" class="link-accent" style="font-size: 0.875rem;">Créer un compte entreprise</a>
    </div>
  </div>
</div>
