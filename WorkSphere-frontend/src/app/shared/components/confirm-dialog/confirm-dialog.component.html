<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/40" (click)="onCancel()"></div>
  <div class="relative bg-surface border border-border rounded-xl shadow-xl p-6 w-full max-w-md mx-4">
    <h3 class="font-heading text-lg font-semibold text-text-heading mb-2">{{ title() }}</h3>
    <p class="text-sm text-text-secondary mb-6">{{ message() }}</p>

    @if (showNoteField()) {
      <textarea
        [ngModel]="noteValue()"
        (ngModelChange)="noteValue.set($event)"
        [placeholder]="notePlaceholder()"
        rows="3"
        class="w-full px-3.5 py-2.5 bg-background border border-border rounded-lg text-text text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors resize-vertical mb-4"
      ></textarea>
    }

    <div class="flex items-center justify-end gap-3">
      <button (click)="onCancel()"
        class="px-4 py-2 text-sm font-semibold text-text-secondary border border-border rounded-md hover:bg-background-alt transition-colors cursor-pointer">
        {{ cancelText() }}
      </button>
      <button (click)="onConfirm()"
        class="px-4 py-2 text-sm font-semibold rounded-md transition-colors cursor-pointer"
        [class]="confirmClass()">
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
