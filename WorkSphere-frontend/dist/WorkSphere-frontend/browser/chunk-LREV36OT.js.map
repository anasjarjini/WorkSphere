@if (imageUrl()) {
  <img
    [src]="imageUrl()"
    [alt]="'Avatar de ' + name()"
    class="shrink-0 rounded-full object-cover"
    [class]="sizeClass()"
  />
} @else {
  <div
    class="shrink-0 rounded-full flex items-center justify-center font-semibold"
    [class]="avatarClass() + ' ' + sizeClass()"
    role="img"
    [attr.aria-label]="'Avatar de ' + name()"
  >
    {{ initials() }}
  </div>
}
